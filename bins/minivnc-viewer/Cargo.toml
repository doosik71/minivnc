[package]
name = "minivnc-viewer"
description = "MiniVNC viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
png = "0.18"
rfb-auth = { path = "../../crates/rfb-auth" }
rfb-client = { path = "../../crates/rfb-client" }
rfb-codec = { path = "../../crates/rfb-codec" }
rfb-proto = { path = "../../crates/rfb-proto" }
softbuffer = "0.4.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The console prompts; Windows asks in dialogs.
[target.'cfg(not(windows))'.dependencies]
rpassword = "7.5.4"
