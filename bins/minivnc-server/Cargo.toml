[package]
name = "minivnc-server"
description = "MiniVNC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
capture-x11 = { path = "../../crates/capture-x11" }
rfb-auth = { path = "../../crates/rfb-auth" }
rfb-codec = { version = "0.1.0", path = "../../crates/rfb-codec" }
rfb-proto = { path = "../../crates/rfb-proto" }
rfb-server = { path = "../../crates/rfb-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
pam = "0.7"
uzers = "0.12.2"
